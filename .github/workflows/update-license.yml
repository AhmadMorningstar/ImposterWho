name: Update License Year Range

on:
  schedule:
    - cron: '0 0 1 1 *' # Runs every Jan 1st
  workflow_dispatch: # Allows manual testing

jobs:
  update-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Year Range in LICENSE
        run: |
          START_YEAR="2026"
          CURRENT_YEAR=$(date +'%Y')
          
          if [ "$START_YEAR" == "$CURRENT_YEAR" ]; then
            # If it's still 2026, keep it as a single year
            NEW_COPYRIGHT="Copyright (c) $START_YEAR"
          else
            # If it's 2027 or later, make it a range: 2026 - 2027
            NEW_COPYRIGHT="Copyright (c) $START_YEAR - $CURRENT_YEAR"
          fi
          
          # This command finds the copyright line and updates it
          sed -i "s/Copyright (c) [0-9]\{4\}\( - [0-9]\{4\}\)*/$NEW_COPYRIGHT/g" LICENSE
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git diff-index --quiet HEAD || git commit -m "chore: update license copyright range 📅"
          git push

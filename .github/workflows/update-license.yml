name: Update License Year

on:
  schedule:
    - cron: '0 0 1 1 *' # Runs at 00:00 on January 1st every year
  workflow_dispatch: # Allows you to run this manually from the "Actions" tab

jobs:
  update-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the update back to your repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Year in LICENSE
        run: |
          CURRENT_YEAR=$(date +'%Y')
          # This replaces "Copyright (c) [any 4 digits]" with "Copyright (c) $CURRENT_YEAR"
          sed -i "s/Copyright (c) [0-9]\{4\}/Copyright (c) $CURRENT_YEAR/g" LICENSE
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git diff-index --quiet HEAD || git commit -m "chore: update license year to $(date +'%Y') 📅"
          git push
